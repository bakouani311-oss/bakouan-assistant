<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bakouan Assistant</title>
<style>
body{background:#101522;color:white;font-family:Arial;text-align:center;padding:25px}
h1{color:#36d6a3}
#chat{max-width:500px;margin:25px auto}
#messages{min-height:180px;background:#202a3b;padding:15px;border-radius:12px;text-align:left;overflow-wrap:anywhere}
input{width:65%;padding:13px;border-radius:8px;border:0}
button{padding:13px;background:#36d6a3;border:0;border-radius:8px}
</style>
</head>
<body>
<h1>BAKOUAN ASSISTANT</h1>
<p>Ton assistant personnel</p>
<div id="chat">
<div id="messages">Bonjour ! Je suis Bakouan Assistant.</div>
<br>
<input id="message" placeholder="Écris ton message...">
<button onclick="envoyer()">Envoyer</button>
</div>
<script>
async function envoyer(){
 const champ=document.getElementById("message");
 const messages=document.getElementById("messages");
 const message=champ.value.trim();
 if(!message)return;
 messages.innerHTML+="<p><b>Toi :</b> "+escapeHTML(message)+"</p>";
 champ.value="";
 try{
  const reponse=await fetch("/.netlify/functions/message",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({message})
  });
  const data=await reponse.json();
  messages.innerHTML+="<p><b>Assistant :</b> "+escapeHTML(data.reply||data.error||"Erreur")+"</p>";
 }catch(e){
  messages.innerHTML+="<p>La fonction n'est pas encore connectée.</p>";
 }
}
function escapeHTML(s){
 return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
</script>
</body>
</html>
